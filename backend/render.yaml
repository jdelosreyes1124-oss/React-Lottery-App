# render.yaml
services:
  - type: web
    name: lottery-backend
    runtime: node
    buildCommand: |
      # Install Chrome (using Debian 11 repository)
      apt-get update &&
      apt-get install -y wget gnupg2 &&
      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add - &&
      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google.list &&
      apt-get update &&
      apt-get install -y google-chrome-stable xvfb &&
      npm install
    startCommand: |
      # Start Xvfb for headless Chrome
      Xvfb :99 -screen 0 1024x768x16 &
      export DISPLAY=:99.0
      npm start
    envVars:
      - key: DISPLAY
        value: :99.0
    healthCheckPath: /api/health
    autoDeploy: true
    plan: free
    region: singapore
    timeout: 120

    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://<your-uri-without-db-name>/
      - key: MONGODB_DB
        value: lotterydb
      - key: SESSION_SECRET
        value: your-super-secret-key-change-this
      - key: FRONTEND_URL
        value: https://react-lottery-app-qber.vercel.app
      - key: COOKIE_DOMAIN
        value: .onrender.com
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
