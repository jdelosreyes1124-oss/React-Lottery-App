# render.yaml
services:
  - type: web
    name: lottery-backend
    runtime: node
    region: singapore
    plan: free
    
    buildCommand: |
      # Install Chrome dependencies and Chrome
      apt-get update && \
      apt-get install -y \
        wget \
        gnupg2 \
        ca-certificates \
        fonts-liberation \
        libasound2 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libatspi2.0-0 \
        libcups2 \
        libdbus-1-3 \
        libdrm2 \
        libgbm1 \
        libgtk-3-0 \
        libnspr4 \
        libnss3 \
        libwayland-client0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxkbcommon0 \
        libxrandr2 \
        xdg-utils && \
      wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add - && \
      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google.list && \
      apt-get update && \
      apt-get install -y google-chrome-stable && \
      npm install
    
    startCommand: npm start
    
    healthCheckPath: /api/health
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: lotterydb
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://react-lottery-app-qber.vercel.app
      - key: COOKIE_DOMAIN
        value: .onrender.com