# render.yaml
services:
  - type: web
    name: lottery-backend
    runtime: node
    region: singapore
    plan: free
    
    buildCommand: npm install
    
    startCommand: npm start
    
    healthCheckPath: /api/health
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: lotterydb
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://react-lottery-app-qber.vercel.app
      - key: COOKIE_DOMAIN
        value: .onrender.com