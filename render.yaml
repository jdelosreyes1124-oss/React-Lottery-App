services:
  - type: web
    name: lottery-backend
    env: node
    buildCommand: |
      cd backend && \
      export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true && \
      apt-get update && \
      apt-get install -y chromium-browser chromium-browser-sandbox ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 xdg-utils && \
      npm install && \
      mkdir -p /opt/render/.cache && \
      chmod -R 777 /opt/render/.cache
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
    buildFilter:
      paths:
      - backend/**/*